<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para o meu Bê</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="relative h-screen w-screen flex items-center justify-center text-gray-800">

    <!-- Controle de Áudio -->
    <div class="absolute top-4 left-4 z-20">
        <audio id="bgMusic" loop preload="auto">
            <source src="musica.mp3" type="audio/mpeg">
        </audio>
        <button id="musicBtn" class="bg-white/80 backdrop-blur-sm text-pink-500 hover:text-pink-600 font-semibold py-2 px-4 rounded-full shadow-md transition duration-300 flex items-center gap-2">
            <span>🎵 Tocar Música</span>
        </button>
    </div>

    <!-- Fotos flutuantes (tamanho e posição ficam no style.css) -->
    <!-- Se suas fotos forem .png ou .jpeg, troque a extensão aqui -->
    <div class="absolute inset-0 pointer-events-none">
        <img src="fotos/Foto-01.jpg" class="floating-photo foto-1 pointer-events-auto" alt="Foto 1">
        <img src="fotos/Foto-02.jpeg" class="floating-photo foto-2 pointer-events-auto" alt="Foto 2">
        <img src="fotos/Foto-03.jpeg" class="floating-photo foto-3 pointer-events-auto" alt="Foto 3">
        <img src="fotos/Foto-04.jpeg" class="floating-photo foto-4 pointer-events-auto" alt="Foto 4">
        <img src="fotos/Foto-05.jpg" class="floating-photo foto-5 pointer-events-auto" alt="Foto 5">
        <img src="fotos/Foto-06.jpeg" class="floating-photo foto-6 pointer-events-auto" alt="Foto 6">
        <img src="Fotos/Foto-07.jpg" class="floating-photo foto-7 pointer-events-auto" alt="Foto 7">
        <img src="Fotos/Foto-08.jpeg" class="floating-photo foto-8 pointer-events-auto" alt="Foto 8">
        <img src="Fotos/Foto-09.jpeg" class="floating-photo foto-9 pointer-events-auto" alt="Foto 9">
    </div>

    <!-- Card Principal -->
    <div class="relative z-10 bg-white/90 backdrop-blur-md p-5 md:p-12 rounded-3xl shadow-2xl max-w-lg w-[85%] md:w-[90%] text-center border border-pink-100 transform transition-all duration-500 scale-100" id="mainCard">

        <div id="contentWrapper">
            <div class="text-4xl md:text-5xl mb-2 md:mb-4">🥺💖</div>
            <h1 id="mainMessage" class="text-2xl md:text-4xl font-semibold text-rose-500 mb-6 md:mb-8 fun-font leading-tight">
                Bê, quer voltar comigo?
            </h1>

            <div id="buttonGroup" class="flex flex-col sm:flex-row items-center justify-center gap-3 md:gap-4">
                <button id="btnYes" class="w-full sm:w-auto bg-rose-500 hover:bg-rose-600 text-white font-bold py-2 px-6 md:py-3 md:px-8 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 text-base md:text-lg">
                    SIM!
                </button>
                <button id="btnNo" class="w-full sm:w-auto bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-6 md:py-3 md:px-8 rounded-full shadow transition-all duration-300 text-base md:text-lg">
                    Não
                </button>
            </div>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');
        const mainMessage = document.getElementById('mainMessage');
        const buttonGroup = document.getElementById('buttonGroup');
        const mainCard = document.getElementById('mainCard');

        let isMusicPlaying = false;

        // Controle de música
        musicBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.innerHTML = '🎵 Tocar Música';
                isMusicPlaying = false;
            } else {
                bgMusic.play()
                    .then(() => {
                        musicBtn.innerHTML = '⏸️ Pausar Música';
                        isMusicPlaying = true;
                    })
                    .catch(err => {
                        console.error('Erro ao tocar a música:', err);
                        alert('Não consegui tocar a música. Confira se o arquivo musica.mp3 está na mesma pasta do Site.html.');
                    });
            }
        });

        // Botão "Não"
        btnNo.addEventListener('click', () => {
            mainCard.classList.add('animate-bounce');
            setTimeout(() => mainCard.classList.remove('animate-bounce'), 1000);

            mainMessage.innerHTML = "Deu um erro no sistema! 😅<br><span class='text-xl text-gray-500 mt-4 block'>Pode clicar em 'SIM' para vermos o que acontece?</span>";
        });

        // Botão "Sim"
        btnYes.addEventListener('click', () => {
            mainMessage.innerHTML = "Eu te amo! ❤️<br><span class='text-2xl text-rose-400 mt-2 block'>Que bom que você tomou a melhor decisão!</span>";
            buttonGroup.style.display = 'none';
            mainCard.classList.add('scale-105');
            explodeHearts();
        });

        function explodeHearts() {
            const emojis = ['❤️', '💖', '💘', '💕', '🥰', '🌹'];
            const numberOfHearts = 60;

            for (let i = 0; i < numberOfHearts; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart-particle');
                heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];

                const angle = Math.random() * Math.PI * 2;
                const velocity = 100 + Math.random() * 300;

                heart.style.setProperty('--tx', `${Math.cos(angle) * velocity}px`);
                heart.style.setProperty('--ty', `${Math.sin(angle) * velocity}px`);
                heart.style.setProperty('--rot', `${(Math.random() - 0.5) * 360}deg`);
                heart.style.animationDelay = `${Math.random() * 0.2}s`;

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 2000);
            }
        }
    </script>
</body>
</html>
